services:
  postgres:
    image: postgres:16-alpine
    container_name: media-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: media-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  createbucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: media-createbucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      (/usr/bin/mc mb myminio/$$MINIO_BUCKET || true) &&
      /usr/bin/mc anonymous set private myminio/$$MINIO_BUCKET
      "
    restart: "no"
  mediaservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    volumes:
      - ./migrations:/app/migrations:ro

  kafka:
    image: redpandadata/redpanda:v24.3.6
    container_name: media-kafka
    profiles: ["kafka"]
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      --advertise-kafka-addr PLAINTEXT://kafka:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 12

  createkafkatopics:
    image: redpandadata/redpanda:v24.3.6
    container_name: media-createkafkatopics
    profiles: ["kafka"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "rpk topic create media.events --brokers kafka:9092 || true;
      rpk topic create media.events.dlq --brokers kafka:9092 || true"
    restart: "no"

volumes:
  postgres_data:
  minio_data:
