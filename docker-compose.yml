services:
  postgres:
    image: postgres:16-alpine
    container_name: media-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: media-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  createbucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: media-createbucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      (/usr/bin/mc mb myminio/$$MINIO_BUCKET || true) &&
      /usr/bin/mc anonymous set private myminio/$$MINIO_BUCKET
      "
    restart: "no"
  mediaservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9090:9090"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    volumes:
      - ./migrations:/app/migrations:ro

  # Kafka под профилем: обычный `make up` её не поднимает, сервис при
  # KAFKA_ENABLED=false к ней не ходит. Redpanda выбрана вместо связки
  # Kafka+ZooKeeper — один контейнер, протокол тот же (SPEC §9).
  kafka:
    image: redpandadata/redpanda:v24.3.6
    container_name: media-kafka
    profiles: ["kafka"]
    restart: unless-stopped
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      --advertise-kafka-addr PLAINTEXT://kafka:9092,OUTSIDE://localhost:19092
    ports:
      # 9092 наружу не публикуем: внутри сети сервис ходит по kafka:9092.
      # 19092 нужен, чтобы запускать go-тесты с хоста.
      - "19092:19092"
    healthcheck:
      # rpk cluster health ходит в Admin API и флага брокеров не принимает.
      # Нам нужен именно Kafka API: от него зависит createkafkatopics ниже.
      test: [ "CMD-SHELL", "rpk cluster info -X brokers=localhost:9092 >/dev/null 2>&1 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Топики создаются явно, а не автосозданием на первом produce:
  # авто-топик получает дефолтные partitions/retention кластера, и
  # конфигурация окружения становится неповторяемой.
  createkafkatopics:
    image: redpandadata/redpanda:v24.3.6
    container_name: media-createkafkatopics
    profiles: ["kafka"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-media.events}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-media.events.dlq}
    entrypoint: >
      /bin/sh -c "
      set -e;
      for t in $$KAFKA_TOPIC $$KAFKA_DLQ_TOPIC; do
      rpk topic describe $$t -X brokers=kafka:9092 >/dev/null 2>&1 ||
      rpk topic create $$t -p 1 -r 1 -X brokers=kafka:9092;
      done
      "
    restart: "no"

volumes:
  postgres_data:
  minio_data:
