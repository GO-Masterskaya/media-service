version: v1
deps:
  - buf.build/bufbuild/protovalidate
breaking:
  use:
    - FILE
  ignore_only:
    # Одноразовое: путь модуля сменился в #93. Сравнение new-vs-new проходит и
    # без этого блока - снять можно любым следующим PR, трогающим buf.yaml.
    FILE_SAME_GO_PACKAGE:
      - proto/media/v1/media.proto
lint:
  use:
    - STANDARD
  except:
    # Frozen gRPC contract (SPEC): proto lives under proto/, enum/RPC names are legacy.
    - PACKAGE_DIRECTORY_MATCH
    - RPC_RESPONSE_STANDARD_NAME
    - ENUM_VALUE_PREFIX
