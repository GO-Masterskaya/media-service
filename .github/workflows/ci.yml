name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.11 resolves to the latest verified patch release in this minor line.
          version: v2.11
          install-only: true

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test
